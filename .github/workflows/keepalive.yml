name: Keep Repository Active

# GitHub вимикає заплановані workflow після 60 днів без активності в репозиторії.
# Раз на тиждень цей workflow повторно вмикає будильник через API —
# без комітів і без сторонніх actions.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Повторно увімкнути будильник
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/alarm.yml/enable"
          gh api "repos/${{ github.repository }}/actions/workflows/alarm.yml" --jq '"Стан будильника: " + .state'
